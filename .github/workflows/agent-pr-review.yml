name: Agent PR Review
run-name: >-
  Agent PR Review #${{ github.event_name == 'repository_dispatch' && github.event.client_payload.pull_request_number || github.event.pull_request.number }}
  ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.base_sha || github.event.pull_request.base.sha }}..${{ github.event_name == 'repository_dispatch' && github.event.client_payload.head_sha || github.event.pull_request.head.sha }}

on:
  repository_dispatch:
    types: [agent-review]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, edited]

permissions:
  actions: read
  checks: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  agent-review:
    if: >-
      github.event_name == 'repository_dispatch'
      || (github.event.pull_request.draft == false
        && github.event.pull_request.head.repo.full_name == github.repository
        && (github.event.action != 'labeled' || github.event.label.name == 'automation/review-ready')
        && (github.event.action != 'edited' || github.event.changes.base.ref.from != null))
    uses: Ornn8/dsh-agent-automation/.github/workflows/agent-review.yml@a635add80f0e1c71ed72622e0dacf89d87223e4f
    with:
      pull_request_number: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.pull_request_number || github.event.pull_request.number }}
      base_sha: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.base_sha || github.event.pull_request.base.sha }}
      head_sha: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.head_sha || github.event.pull_request.head.sha }}
      profile_id: github-pr-cycle
      workflow_id: default
      stage_id: review
