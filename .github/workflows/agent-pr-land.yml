name: Agent PR Advancement
run-name: >-
  Agent PR Advancement request:${{ github.event_name == 'repository_dispatch' && (github.event.client_payload.request_id || 'legacy') || github.run_id }}

on:
  repository_dispatch:
    types: [dsh-land, dsh-advance]
  workflow_run:
    workflows: ["CI","Agent PR Review"]
    types: [completed]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited, labeled]

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  advance-pull-request:
    if: >-
      github.event_name == 'repository_dispatch'
      || (github.event_name == 'workflow_run'
        && (github.event.workflow_run.name == 'Agent PR Review'
          || contains(fromJSON(vars.DSH_AUTOMATION_CI_WORKFLOWS), github.event.workflow_run.name)))
      || (github.event_name == 'pull_request_target'
        && github.event.pull_request.head.repo.full_name == github.repository
        && (github.event.action != 'labeled' || github.event.label.name == 'automation/review-ready'))
    uses: Ornn8/dsh-agent-automation/.github/workflows/advance-pr.yml@a7eb3370a86c0d3d68ec241a8e5789a86a1ac2b5
    with:
      pull_request_number: ${{ github.event_name == 'repository_dispatch' && (github.event.client_payload.pull_request_number || github.event.client_payload.pr_number) || github.event_name == 'pull_request_target' && github.event.pull_request.number || 0 }}
      base_sha: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.base_sha || github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || '' }}
      head_sha: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.head_sha || github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
      profile_id: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.profile_id || '' }}
      workflow_id: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.workflow_id || '' }}
      source_run_id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Agent PR Review' && github.event.workflow_run.id || 0 }}
      source_run_attempt: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Agent PR Review' && github.event.workflow_run.run_attempt || 0 }}
      required_checks_json: ${{ vars.DSH_AUTOMATION_REQUIRED_CHECKS }}
      controller_login: ${{ vars.AGENT_AUTOMATION_CONTROLLER_LOGIN }}
