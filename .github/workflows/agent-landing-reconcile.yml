name: Agent Landing Reconcile

on:
  workflow_dispatch:
  schedule:
    - cron: '8-59/15 * * * *'

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  backlog:
    uses: Ornn8/dsh-agent-automation/.github/workflows/dispatch-backlog.yml@3ad9ba7c8f78da3d48e20381aae6c0c369f95d24

  review-reconcile:
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-reviews.yml@3ad9ba7c8f78da3d48e20381aae6c0c369f95d24

  reconcile:
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-landing.yml@3ad9ba7c8f78da3d48e20381aae6c0c369f95d24
    with:
      profile_id: github-pr-cycle
