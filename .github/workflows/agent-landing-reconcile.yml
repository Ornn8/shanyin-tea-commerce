name: Agent Landing Reconcile

on:
  workflow_dispatch:
  schedule:
    - cron: '8-59/15 * * * *'

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  backlog:
    uses: Ornn8/dsh-agent-automation/.github/workflows/dispatch-backlog.yml@c975520c8f4e17718a0890e2465c3d9fa13b97e1

  review-reconcile:
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-reviews.yml@c975520c8f4e17718a0890e2465c3d9fa13b97e1

  reconcile:
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-landing.yml@c975520c8f4e17718a0890e2465c3d9fa13b97e1
    with:
      profile_id: github-pr-cycle
