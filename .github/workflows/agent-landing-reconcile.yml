name: Agent Landing Reconcile

on:
  workflow_dispatch:
  schedule:
    - cron: '8-59/15 * * * *'

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  backlog:
    uses: Ornn8/dsh-agent-automation/.github/workflows/dispatch-backlog.yml@efc20873829a635ba218abf822bbfc443688d0ed

  review-reconcile:
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-reviews.yml@efc20873829a635ba218abf822bbfc443688d0ed

  reconcile:
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-landing.yml@efc20873829a635ba218abf822bbfc443688d0ed
    with:
      profile_id: github-pr-cycle
