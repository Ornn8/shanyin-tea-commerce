name: Agent Landing Reconcile

on:
  workflow_dispatch:
  schedule:
    - cron: '8-59/15 * * * *'

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  backlog:
    uses: Ornn8/dsh-agent-automation/.github/workflows/dispatch-backlog.yml@69cb3077fd000c3bfbd8b8e3214616cbf92f3054

  review-reconcile:
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-reviews.yml@69cb3077fd000c3bfbd8b8e3214616cbf92f3054

  reconcile:
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-landing.yml@69cb3077fd000c3bfbd8b8e3214616cbf92f3054
    with:
      profile_id: github-pr-cycle
