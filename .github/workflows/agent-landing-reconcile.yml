name: Agent Landing Reconcile

on:
  workflow_dispatch:
  schedule:
    - cron: '8-59/15 * * * *'

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  backlog:
    uses: Ornn8/dsh-agent-automation/.github/workflows/dispatch-backlog.yml@f4953872233dc5bb5902f6978ca6cd6ea3f7fdd4

  review-reconcile:
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-reviews.yml@f4953872233dc5bb5902f6978ca6cd6ea3f7fdd4

  reconcile:
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-landing.yml@f4953872233dc5bb5902f6978ca6cd6ea3f7fdd4
    with:
      profile_id: github-pr-cycle
