name: Agent Landing Reconcile

on:
  workflow_dispatch:
  schedule:
    - cron: '8-59/15 * * * *'

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  backlog:
    uses: Ornn8/dsh-agent-automation/.github/workflows/dispatch-backlog.yml@f79f3d1e5b5d20c4c8639d2a811380ba52cefcf9

  review-reconcile:
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-reviews.yml@f79f3d1e5b5d20c4c8639d2a811380ba52cefcf9

  reconcile:
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-landing.yml@f79f3d1e5b5d20c4c8639d2a811380ba52cefcf9
    with:
      profile_id: github-pr-cycle
