name: Agent Landing Reconcile

on:
  workflow_dispatch:
  schedule:
    - cron: '8-59/15 * * * *'

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  backlog:
    uses: Ornn8/dsh-agent-automation/.github/workflows/dispatch-backlog.yml@a635add80f0e1c71ed72622e0dacf89d87223e4f

  review-reconcile:
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-reviews.yml@a635add80f0e1c71ed72622e0dacf89d87223e4f

  reconcile:
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-landing.yml@a635add80f0e1c71ed72622e0dacf89d87223e4f
    with:
      profile_id: github-pr-cycle
      workflow_id: default
