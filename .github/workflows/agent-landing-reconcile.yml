name: Agent Landing Reconcile

on:
  workflow_dispatch:
  schedule:
    - cron: '8-59/15 * * * *'

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  backlog:
    uses: Ornn8/dsh-agent-automation/.github/workflows/dispatch-backlog.yml@f8385c921e555fdd59636d959fac7817b2d1ca86

  review-reconcile:
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-reviews.yml@f8385c921e555fdd59636d959fac7817b2d1ca86

  reconcile:
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-landing.yml@f8385c921e555fdd59636d959fac7817b2d1ca86
    with:
      profile_id: github-pr-cycle
