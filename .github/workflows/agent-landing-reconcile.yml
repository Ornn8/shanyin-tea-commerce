name: Agent Landing Reconcile

on:
  workflow_dispatch:
  schedule:
    - cron: '8-59/15 * * * *'

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  backlog:
    uses: Ornn8/dsh-agent-automation/.github/workflows/dispatch-backlog.yml@2fa5c961736314c114331ad113407802f975b9fe

  review-reconcile:
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-reviews.yml@2fa5c961736314c114331ad113407802f975b9fe

  reconcile:
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-landing.yml@2fa5c961736314c114331ad113407802f975b9fe
    with:
      profile_id: github-pr-cycle
