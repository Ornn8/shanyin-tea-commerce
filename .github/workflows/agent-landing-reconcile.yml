name: Agent Landing Reconcile

on:
  workflow_dispatch:
  schedule:
    - cron: '8-59/15 * * * *'

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  backlog:
    uses: Ornn8/dsh-agent-automation/.github/workflows/dispatch-backlog.yml@7e014480ef084a6a5031f06665025f6a626b2ed9

  review-reconcile:
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-reviews.yml@7e014480ef084a6a5031f06665025f6a626b2ed9

  reconcile:
    uses: Ornn8/dsh-agent-automation/.github/workflows/reconcile-landing.yml@7e014480ef084a6a5031f06665025f6a626b2ed9
    with:
      profile_id: github-pr-cycle
