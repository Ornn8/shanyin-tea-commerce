name: Agent Repository Supervision

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      apply_changes:
        description: Apply validated repository-management changes.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  supervise:
    uses: Ornn8/dsh-agent-automation/.github/workflows/repository-supervisor.yml@f4953872233dc5bb5902f6978ca6cd6ea3f7fdd4
    with:
      upstream_repository: Ornn8/shanyin-tea-commerce
      apply_changes: ${{ github.event_name == 'schedule' || inputs.apply_changes }}
      max_mutations: 5
