name: Agent Recovery

on:
  workflow_run:
    workflows: [Agent Issues, Agent PR Rework, Agent PR CI Repair, Agent PR Review]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  observe:
    if: >-
      contains(fromJSON('["failure", "cancelled", "timed_out", "startup_failure", "stale"]'), github.event.workflow_run.conclusion)
      && github.event.workflow_run.name != github.workflow
    uses: Ornn8/dsh-agent-automation/.github/workflows/observe-agent-fault.yml@bdd6265b3f636a01888548e5471e9caa3932321c
    with:
      source_run_id: ${{ github.event.workflow_run.id }}

  recover:
    needs: observe
    if: >-
      always()
      && contains(fromJSON('["failure", "cancelled", "timed_out", "startup_failure", "stale"]'), github.event.workflow_run.conclusion)
      && github.event.workflow_run.name != github.workflow
    uses: Ornn8/dsh-agent-automation/.github/workflows/recover-backlog.yml@bdd6265b3f636a01888548e5471e9caa3932321c
    with:
      source_run_id: ${{ github.event.workflow_run.id }}
