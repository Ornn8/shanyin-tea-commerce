name: Agent Recovery

on:
  workflow_run:
    workflows: [Agent Issues, Agent PR Rework, Agent PR CI Repair, Agent PR Review]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  observe:
    uses: Ornn8/dsh-agent-automation/.github/workflows/observe-agent-fault.yml@efc20873829a635ba218abf822bbfc443688d0ed
    with:
      source_run_id: ${{ github.event.workflow_run.id }}

  recover:
    needs: observe
    if: always()
    uses: Ornn8/dsh-agent-automation/.github/workflows/recover-backlog.yml@efc20873829a635ba218abf822bbfc443688d0ed
    with:
      source_run_id: ${{ github.event.workflow_run.id }}
