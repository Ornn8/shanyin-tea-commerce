name: Agent Recovery

on:
  workflow_run:
    workflows: [Agent Issues, Agent PR Rework, Agent PR CI Repair, Agent PR Review]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  observe:
    uses: Ornn8/dsh-agent-automation/.github/workflows/observe-agent-fault.yml@a7eb3370a86c0d3d68ec241a8e5789a86a1ac2b5
    with:
      source_run_id: ${{ github.event.workflow_run.id }}
      source_run_attempt: ${{ github.event.workflow_run.run_attempt }}

  recover:
    needs: observe
    if: always()
    uses: Ornn8/dsh-agent-automation/.github/workflows/recover-backlog.yml@a7eb3370a86c0d3d68ec241a8e5789a86a1ac2b5
    with:
      source_run_id: ${{ github.event.workflow_run.id }}
