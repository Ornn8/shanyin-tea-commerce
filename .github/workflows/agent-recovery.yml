name: Agent Recovery

on:
  workflow_run:
    workflows: [Agent Issues, Agent PR Rework, Agent PR CI Repair, Agent PR Review]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  recover:
    if: >-
      contains(fromJSON('["failure", "cancelled", "timed_out", "startup_failure", "stale"]'), github.event.workflow_run.conclusion)
      && github.event.workflow_run.name != github.workflow
    uses: Ornn8/dsh-agent-automation/.github/workflows/recover-backlog.yml@f79f3d1e5b5d20c4c8639d2a811380ba52cefcf9
    with:
      source_run_id: ${{ github.event.workflow_run.id }}
