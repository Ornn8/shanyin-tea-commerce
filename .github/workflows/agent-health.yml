name: Agent Pipeline Health

on:
  workflow_dispatch:
  schedule:
    - cron: '11 * * * *'
    - cron: '29 3 * * *'

permissions:
  actions: read
  contents: read

jobs:
  review-worker:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '29 3 * * *'
    name: review worker
    uses: Ornn8/dsh-agent-automation/.github/workflows/pipeline-health.yml@7e014480ef084a6a5031f06665025f6a626b2ed9
    with:
      role: review
      readiness_canary: ${{ github.event.schedule == '29 3 * * *' }}

  change-worker:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '29 3 * * *'
    name: change worker
    uses: Ornn8/dsh-agent-automation/.github/workflows/pipeline-health.yml@7e014480ef084a6a5031f06665025f6a626b2ed9
    with:
      role: change
      readiness_canary: ${{ github.event.schedule == '29 3 * * *' }}

  hosted-watchdog:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: hosted queue watchdog
    uses: Ornn8/dsh-agent-automation/.github/workflows/runner-watchdog.yml@7e014480ef084a6a5031f06665025f6a626b2ed9
    with:
      controller_repository: Ornn8/dsh-agent-automation
