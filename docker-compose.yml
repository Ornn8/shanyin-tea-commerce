services:
  postgres:
    image: postgres:17-alpine
    container_name: shanyin-postgres
    environment:
      POSTGRES_USER: shanyin
      POSTGRES_PASSWORD: shanyin
      POSTGRES_DB: shanyin
    ports:
      - "5432:5432"
    volumes:
      - shanyin-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shanyin -d shanyin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shanyin-pgdata:
